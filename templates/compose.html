{% extends "base.html" %}

{% block title %}Compose Email - Gmail-like System{% endblock %}

{% block content %}
<div class="card">
    <h2 style="margin-bottom: 20px;">Compose Email</h2>
    <form method="POST">
        <div class="form-group">
            <label for="recipient">To</label>
            <select id="recipient" name="recipient" required>
                <option value="">Select recipient...</option>
                {% for user in users %}
                    {% if user.email_address != current_user %}
                        <option value="{{ user.email_address }}">{{ user.name }} ({{ user.email_address }})</option>
                    {% endif %}
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required>
        </div>
        <div class="form-group">
            <label for="body">Message</label>
            <textarea id="body" name="body" required></textarea>
        </div>
        <div class="actions">
            <button type="submit" class="btn">Send Email</button>
            <a href="{{ url_for('inbox') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
